name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_ventas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_ventas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://agent:agent@127.0.0.1:5432/agent_ventas
      # Sin key corre con FakeProvider (offline, determinista).
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Migraciones
        run: alembic upgrade head
      # tests/test_api.py y test_salesmind.py escriben SQLite en /tmp/opencode/.
      - name: Directorio de tests SQLite
        run: mkdir -p /tmp/opencode
      - name: Suite
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t agent-ventas .
