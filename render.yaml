# Render — Agent Ventas
# Dashboard: https://render.com

services:
  - type: web
    name: agent-ventas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migraciones antes de arrancar: crea la tabla devices y las columnas de claim.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: prod
      # Fail-fast: con true el servidor se NIEGA a arrancar en prod (FakeProvider).
      - key: ALLOW_FAKE_LLM
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # API key para endpoints admin (/api/onboarding). Visible en el dashboard de Render.
      - key: ADMIN_API_KEY
        generateValue: true
      # CORS explícito (nunca "*"): solo el propio dominio.
      - key: ALLOWED_ORIGINS
        value: https://agent-ventas.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: agent-ventas-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false

databases:
  - name: agent-ventas-db
    plan: free
    databaseName: agent_ventas
    user: agent
